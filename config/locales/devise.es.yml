---
es:
  devise:
    confirmations:
      confirmed: Tu dirección de correo electrónico ha sido confirmada exitosamente.
      send_instructions: Recibirás un correo electrónico con instrucciones sobre cómo confirmar tu dirección de correo electrónico en unos minutos.
      send_paranoid_instructions: Si tu dirección de correo electrónico existe en nuestra base de datos, recibirás un correo con instrucciones para confirmar tu dirección de correo electrónico en unos minutos.
    failure:
      already_authenticated: Ya has iniciado sesión.
      inactive: Tu cuenta aún no ha sido activada.
      invalid: "%{authentication_keys} o contraseña inválidos."
      last_attempt: Tienes un intento más antes de que tu cuenta sea bloqueada.
      locked: Tu cuenta está bloqueada.
      not_found_in_database: "%{authentication_keys} o contraseña inválidos."
      timeout: Tu sesión ha expirado. Por favor, inicia sesión nuevamente para continuar.
      unauthenticated: Necesitas iniciar sesión o registrarte antes de continuar.
      unconfirmed: Debes confirmar tu dirección de correo electrónico antes de continuar.
    mailer:
      confirmation_instructions:
        subject: Instrucciones de confirmación
      email_changed:
        subject: Correo electrónico modificado
      password_change:
        subject: Contraseña modificada
      reset_password_instructions:
        subject: Instrucciones para restablecer la contraseña
      unlock_instructions:
        subject: Instrucciones para desbloquear la cuenta
    omniauth_callbacks:
      failure: No se pudo autenticar desde %{kind} debido a "%{reason}".
      success: Autenticado exitosamente desde tu cuenta de %{kind}.
    passwords:
      no_token: No puedes acceder a esta página sin haber solicitado previamente el restablecimiento de contraseña. Si llegaste desde un correo, asegúrate de usar la URL completa proporcionada.
      send_instructions: Recibirás un correo electrónico con instrucciones para restablecer tu contraseña en unos minutos.
      send_paranoid_instructions: Si tu dirección de correo electrónico existe en nuestra base de datos, recibirás un enlace para recuperar tu contraseña en unos minutos.
      updated: Tu contraseña ha sido cambiada exitosamente. Ahora has iniciado sesión.
      updated_not_active: Tu contraseña ha sido cambiada exitosamente.
    registrations:
      destroyed: "¡Adiós! Tu cuenta ha sido cancelada exitosamente. Esperamos verte pronto de nuevo."
      signed_up: "¡Bienvenido! Te has registrado exitosamente."
      signed_up_but_inactive: Te has registrado exitosamente, pero no pudimos iniciar sesión porque tu cuenta aún no ha sido activada.
      signed_up_but_locked: Te has registrado exitosamente, pero no pudimos iniciar sesión porque tu cuenta está bloqueada.
      signed_up_but_unconfirmed: Se ha enviado un mensaje con un enlace de confirmación a tu correo electrónico. Por favor, sigue el enlace para activar tu cuenta.
      update_needs_confirmation: Has actualizado exitosamente tu cuenta, pero necesitamos verificar tu nueva dirección de correo electrónico. Por favor, revisa tu correo y sigue el enlace de confirmación.
      updated: Tu cuenta ha sido actualizada exitosamente.
      updated_but_not_signed_in: Tu cuenta ha sido actualizada exitosamente, pero como cambiaste tu contraseña, necesitas iniciar sesión nuevamente.
    sessions:
      already_signed_out: Sesión cerrada exitosamente.
      signed_in: Inicio de sesión exitoso.
      signed_out: Has cerrado sesión exitosamente.
    unlocks:
      send_instructions: Recibirás un correo electrónico con instrucciones para desbloquear tu cuenta en unos minutos.
      send_paranoid_instructions: Si tu cuenta existe, recibirás un correo electrónico con instrucciones para desbloquearla en unos minutos.
      unlocked: Tu cuenta ha sido desbloqueada exitosamente. Por favor, inicia sesión para continuar.
  errors:
    messages:
      already_confirmed: ya fue confirmada, intenta iniciar sesión
      confirmation_period_expired: debe ser confirmada dentro de %{period}, por favor solicita una nueva
      expired: ha expirado, por favor solicita una nueva
      not_found: no encontrado
      not_locked: no estaba bloqueado
      not_saved:
        one: '1 error impidió que se guardara %{resource}:'
        other: "%{count} errores impidieron que se guardara %{resource}:"
